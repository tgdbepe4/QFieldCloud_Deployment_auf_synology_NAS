# Nach /etc/netplan/99-static.yaml, dann: sudo netplan apply
# (cloud-init Netzwerkkonfiguration vorher deaktivieren)
network:
  version: 2
  ethernets:
    ens3:
      dhcp4: false
      addresses: [192.168.1.20/24]
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
